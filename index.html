<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeachToLearn — Salle de classe</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-width: 320px;
        overflow: hidden;
        background: #101827;
      }

      canvas {
        display: block;
      }

      .character-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 76px;
        padding: 5px 8px;
        border: 1px solid #ffffff66;
        border-radius: 8px;
        background: #101827d9;
        box-shadow: 0 3px 12px #0008;
        color: #f7f3e8;
        font-size: 12px;
        line-height: 1.2;
        text-align: center;
        transform: translateY(-50%);
      }

      .character-label span {
        margin-top: 2px;
        color: #bad7ff;
        font-size: 10px;
      }

      #interaction-hint {
        position: fixed;
        top: 18px;
        left: 50%;
        z-index: 1;
        transform: translateX(-50%);
        padding: 9px 14px;
        border: 1px solid #ffffff33;
        border-radius: 999px;
        background: #101827dd;
        color: #f7f3e8;
        font-size: 14px;
        pointer-events: none;
      }

      #chat-panel {
        position: fixed;
        top: 18px;
        right: 18px;
        bottom: 18px;
        z-index: 2;
        display: none;
        width: min(390px, calc(100vw - 36px));
        flex-direction: column;
        gap: 12px;
        padding: 18px;
        border: 1px solid #ffffff2e;
        border-radius: 16px;
        background: #172235f5;
        box-shadow: 0 18px 48px #0008;
        color: #f7f3e8;
      }

      #chat-panel.is-open { display: flex; }
      #chat-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      #chat-title { margin: 0; font-size: 20px; }
      #chat-role { margin: 3px 0 0; color: #bad7ff; font-size: 13px; }
      #close-chat { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 25px; line-height: 1; }
      #chat-messages { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 4px; }
      .message { max-width: 88%; padding: 10px 12px; border-radius: 12px; line-height: 1.4; white-space: pre-wrap; }
      .message.user { align-self: flex-end; background: #3d6fa3; }
      .message.agent { align-self: flex-start; background: #ffffff16; }
      #chat-form { display: flex; gap: 8px; }
      #chat-input { min-width: 0; flex: 1; resize: none; border: 1px solid #ffffff33; border-radius: 10px; background: #0d1522; color: inherit; padding: 10px; font: inherit; }
      #chat-form button { border: 0; border-radius: 10px; background: #e8dfcf; color: #182238; cursor: pointer; font-weight: 700; padding: 0 14px; }
      #chat-status { min-height: 18px; margin: 0; color: #bad7ff; font-size: 12px; }
    </style>
  </head>
  <body>
    <aside id="chat-panel" aria-label="Conversation avec un personnage" aria-hidden="true">
      <header id="chat-header">
        <div><h1 id="chat-title">Discussion</h1><p id="chat-role"></p></div>
        <button id="close-chat" type="button" aria-label="Fermer la discussion">×</button>
      </header>
      <div id="chat-messages" aria-live="polite"></div>
      <form id="chat-form"><textarea id="chat-input" rows="3" placeholder="Explique ta notion…"></textarea><button type="submit">Envoyer</button></form>
      <p id="chat-status"></p>
    </aside>
    <script type="module" src="/main.js"></script>
  </body>
</html>
