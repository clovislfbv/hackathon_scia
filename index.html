<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeachToLearn — Salle de classe</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-width: 320px;
        overflow: hidden;
        background: #101827;
      }

      canvas {
        display: block;
      }

      .character-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 76px;
        padding: 5px 8px;
        border: 1px solid #ffffff66;
        border-radius: 8px;
        background: #101827d9;
        box-shadow: 0 3px 12px #0008;
        color: #f7f3e8;
        font-size: 12px;
        line-height: 1.2;
        text-align: center;
        transform: translateY(-50%);
      }

      .character-label span {
        margin-top: 2px;
        color: #bad7ff;
        font-size: 10px;
      }

      #interaction-hint {
        position: fixed;
        bottom: 18px;
        left: 18px;
        z-index: 1;
        max-width: min(390px, calc(100vw - 36px));
        padding: 10px 14px;
        border: 1px solid #ffffff33;
        border-radius: 12px;
        background: #101827dd;
        color: #f7f3e8;
        font-size: 13px;
        line-height: 1.45;
        pointer-events: none;
      }

      #interaction-hint kbd { padding: 1px 5px; border: 1px solid #ffffff55; border-radius: 4px; background: #ffffff18; font: inherit; font-weight: 700; }
      #chat-panel.is-open ~ #interaction-hint { display: none; }

      #phase-panel {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: calc(100vw - 36px);
        padding: 10px 12px;
        border: 1px solid #ffffff33;
        border-radius: 10px;
        background: #101827dd;
        color: #f7f3e8;
        font-size: 13px;
      }

      #phase-panel button { border: 0; border-radius: 7px; background: #e8dfcf; color: #182238; cursor: pointer; padding: 7px 10px; font: inherit; font-weight: 700; }
      #phase-panel button:disabled { cursor: not-allowed; opacity: 0.45; }

      #objectives-panel {
        position: fixed;
        top: 82px;
        left: 18px;
        z-index: 1;
        width: min(310px, calc(100vw - 36px));
        padding: 14px;
        border: 1px solid #ffffff33;
        border-radius: 12px;
        background: #101827ed;
        color: #f7f3e8;
        box-shadow: 0 8px 24px #0005;
      }
      #objectives-panel h2 { margin: 0 0 8px; font-size: 15px; }
      #objectives-empty { margin: 0; color: #bad7ff; font-size: 12px; }
      #objectives-list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .objective { display: grid; grid-template-columns: 18px 1fr; gap: 9px; align-items: start; font-size: 13px; line-height: 1.35; }
      .objective-checkbox { width: 17px; height: 17px; margin: 1px 0 0; accent-color: #2da968; cursor: default; }
      .objective-checkbox:disabled { opacity: 1; }
      .objective.is-validated { color: #d7ffe7; }
      .objective.is-not-validated { color: #ffcacc; }

      #phase-transition {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #000;
        opacity: 0;
        pointer-events: all;
        transition: opacity 450ms ease-in-out;
      }
      #phase-transition.is-visible { opacity: 1; }

      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 1;
        width: 18px;
        height: 18px;
        box-sizing: border-box;
        border: 2px solid #f7f3e8;
        border-radius: 50%;
        box-shadow: 0 0 5px #000;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      #crosshair::before,
      #crosshair::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 4px;
        background: #f7f3e8;
        content: "";
        transform: translate(-50%, -50%);
      }

      #chat-panel.is-open ~ #crosshair { display: none; }

      #chat-panel {
        position: fixed;
        top: 18px;
        right: 18px;
        bottom: 18px;
        z-index: 2;
        display: none;
        width: min(390px, calc(100vw - 36px));
        flex-direction: column;
        gap: 12px;
        padding: 18px;
        border: 1px solid #ffffff2e;
        border-radius: 16px;
        background: #172235f5;
        box-shadow: 0 18px 48px #0008;
        color: #f7f3e8;
      }

      #chat-panel.is-open { display: flex; }
      #chat-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      #chat-title { margin: 0; font-size: 20px; }
      #chat-role { margin: 3px 0 0; color: #bad7ff; font-size: 13px; }
      #close-chat { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 25px; line-height: 1; }
      #chat-messages { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 4px; }
      .message { max-width: 88%; padding: 10px 12px; border-radius: 12px; line-height: 1.4; white-space: pre-wrap; }
      .message.user { align-self: flex-end; background: #3d6fa3; }
      .message.agent { align-self: flex-start; display: flex; gap: 9px; background: #ffffff16; }
      .message-body { min-width: 0; }
      .message-portrait { width: 40px; height: 40px; flex: 0 0 40px; border: 1px solid #ffffff55; border-radius: 50%; background: #101827; }
      .message-identity { font-size: 13px; font-weight: 700; }
      .message-identity + span { display: block; margin-bottom: 4px; color: #bad7ff; font-size: 11px; }
      .message-text { white-space: pre-wrap; }
      .message-text p { margin: 0 0 8px; }
      .message-text p:last-child { margin-bottom: 0; }
      .message-text h1, .message-text h2, .message-text h3 { margin: 10px 0 6px; font-size: 1em; }
      .message-text ul, .message-text ol { margin: 4px 0 8px; padding-left: 20px; }
      .message-text blockquote { margin: 6px 0; padding-left: 9px; border-left: 3px solid #bad7ff; color: #d4e6ff; }
      .message-text blockquote p { margin: 0; }
      .message-text code { padding: 1px 4px; border-radius: 4px; background: #0005; font-family: ui-monospace, monospace; font-size: 0.9em; }
      .message-text pre { overflow-x: auto; padding: 8px; border-radius: 6px; background: #0005; white-space: pre-wrap; }
      .message-text a { color: #bad7ff; }
      .message-text .math-inline { display: inline-block; }
      .message-text .math-display { overflow-x: auto; margin: 9px 0; padding: 7px; border-radius: 6px; background: #0003; text-align: center; }
      .message-text .katex-display { margin: 0; }
      #chat-form { display: flex; gap: 8px; }
      #chat-input { min-width: 0; flex: 1; resize: none; border: 1px solid #ffffff33; border-radius: 10px; background: #0d1522; color: inherit; padding: 10px; font: inherit; }
      #chat-form button { border: 0; border-radius: 10px; background: #e8dfcf; color: #182238; cursor: pointer; font-weight: 700; padding: 0 14px; }
      #speech-input-button { min-width: 42px; padding: 0 10px; font-size: 18px; }
      #speech-input-button.is-listening { background: #e87070; color: #fff; animation: microphone-pulse 1s ease-in-out infinite; }
      @keyframes microphone-pulse { 50% { box-shadow: 0 0 0 5px #e8707066; } }
      #restart-game-button { border: 0; border-radius: 10px; background: #e8dfcf; color: #182238; cursor: pointer; font: inherit; font-weight: 700; padding: 11px 14px; }
      #chat-form button:disabled, #chat-input:disabled { cursor: wait; opacity: 0.65; }
      #chat-status { min-height: 18px; margin: 0; color: #bad7ff; font-size: 12px; }
    </style>
  </head>
  <body>
    <aside id="chat-panel" aria-label="Conversation avec un personnage" aria-hidden="true">
      <header id="chat-header">
        <div><h1 id="chat-title">Discussion</h1><p id="chat-role"></p></div>
        <button id="close-chat" type="button" aria-label="Fermer la discussion">×</button>
      </header>
      <div id="chat-messages" aria-live="polite"></div>
      <form id="chat-form"><textarea id="chat-input" rows="3" placeholder="Explique ta notion…"></textarea><button id="speech-input-button" type="button" aria-label="Dicter un message" title="Dicter un message">🎤</button><button type="submit">Envoyer</button></form>
      <button id="restart-game-button" type="button" hidden>Relancer une partie</button>
      <p id="chat-status"></p>
    </aside>
    <div id="interaction-hint" aria-live="polite">
      <strong>Discuter :</strong> <kbd>T</kbd> pour parler à la classe.<br>
      Vise un PNJ avec le réticule et clique pour lui parler directement.<br>
      <kbd>Échap</kbd> ferme le chat.
    </div>
    <div id="phase-panel" aria-live="polite">
      <strong id="phase-status">Briefing avec l'examinateur</strong>
      <button id="ready-button" type="button" disabled>Prêt à donner le cours</button>
      <button id="end-class-button" type="button" hidden>Terminer le cours</button>
    </div>
    <aside id="objectives-panel" aria-live="polite" aria-label="Objectifs du cours" hidden>
      <h2>Objectifs à aborder</h2>
      <p id="objectives-empty">En attente des objectifs de l'examinateur…</p>
      <ul id="objectives-list"></ul>
    </aside>
    <div id="phase-transition" aria-hidden="true" hidden></div>
    <div id="crosshair" aria-hidden="true"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
